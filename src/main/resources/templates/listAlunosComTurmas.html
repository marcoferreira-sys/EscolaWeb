<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Alunos com Turmas</title>
    <link th:href="@{/css/estiloPaginaListagem.css}" rel="stylesheet" />
</head>
<body>
    <a href="/" class="estiloBotaoLink">Voltar para Página Inicial</a>

    <h2>Listagem de Alunos com informações de Turma</h2>

    <table class="tabela-listagem">
        <thead>
            <tr>
                <th>Matrícula</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Turmas</th>
            </tr>
        </thead>
        <tbody>
                <tr th:each="aluno : ${alunosComTurmas}">
                    <td th:text="${aluno.matricula}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.idade}"></td>
                    <td th:text="${aluno.turmas}"></td>
                </tr>
        </tbody>
    </table>

</body>
</html>
