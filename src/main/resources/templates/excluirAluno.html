<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Aluno</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <h2>Exclusão de Aluno</h2>
        <form th:action="@{/alunos/excluir}" th:object="${aluno}" method="post">
            <input type="hidden" th:field="*{matricula}" />

            <div class="form-group">
                <label>Matrícula:</label>
                <span th:text="*{matricula}"></span>
            </div>

            <div class="form-group">
                <label>Nome:</label>
                <span th:text="*{nome}"></span>
            </div>

            <div class="form-group">
                <label>RG:</label>
                <span th:text="*{rg}"></span>
            </div>

            <div class="form-group">
                <input type="submit" value="Excluir">

                <a href="/alunos">
                    <input type="button" value="Cancelar">
                </a>
            </div>

        </form>
    </div>

</body>
</html>
